name: Build and Verify Docker Image for ARM64

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "dckr_pat_P-jkYF-QC9HWMmHVL39dBmKIbg0" | docker login -u "ndubuoke" --password-stdin

      # Build and push the Docker image for ARM64
      - name: Build and Push Docker Image for ARM64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag ndubuoke/auth:arm64 \
            --push .

      # Pull the image back for verification
      - name: Pull the Image for Verification
        run: docker pull ndubuoke/auth:arm64

      # Verify the image architecture
      - name: Verify Image Platform
        run: |
          ARCH=$(docker inspect ndubuoke/auth:arm64 --format '{{.Architecture}}')
          if [ "$ARCH" != "arm64" ]; then
            echo "Error: Image is not built for arm64 platform. Detected: $ARCH"
            exit 1
          fi
          echo "Image successfully built for arm64 platform!"
