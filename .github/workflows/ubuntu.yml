name: Build Docker Image for ARM64

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Login to Docker Hub (if pushing the image)
      # Uncomment and set secrets for Docker Hub credentials if needed
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # Build the Docker image for ARM64
      - name: Build Docker Image for ARM64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag determinas/auth:arm64 .

      # Verify the image architecture
      - name: Verify Image Platform
        run: |
          ARCH=$(docker inspect determinas/auth:arm64 --format '{{.Architecture}}')
          if [ "$ARCH" != "arm64" ]; then
            echo "Error: Image is not built for arm64 platform. Detected: $ARCH"
            exit 1
          fi
          echo "Image successfully built for arm64 platform!"