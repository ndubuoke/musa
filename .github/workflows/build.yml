name: build-tenant-dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Install Docker
        run: |
          brew install docker
          brew install colima
          colima start
      - uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'
      - name: Install dependencies
        run: |
          cd tenant
          pwd
          ls
